- name: ".NET"
  hosts: 127.0.0.1
  connection: local

  tasks:
    - name: "Install pre-requisite"
      become: yes
      ansible.builtin.dnf:
        name: "{{ item }}"
      loop:
        - clang
        - libicu
        - zlib-devel
        - zlib-ng-devel
        - zlib-ng-compat-devel

    - name: "Enable SHA1 signatures in OpenSSL for .NET Strong Name signing"
      ansible.builtin.blockinfile:
        path: ~/.bashrc
        marker: "### {mark} Ansible managed: Enable SHA1 in OpenSSL for .NET"
        block: |
          export OPENSSL_ENABLE_SHA1_SIGNATURES=1

    - name: "Install dnvm"
      ansible.builtin.shell: curl --proto '=https' -sSf https://dnvm.net/install.sh | sh -s -- -y --skip-tracking
      args:
        creates: ~/.local/share/dnvm/dnvm
