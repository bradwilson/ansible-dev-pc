#########################################################################################
#
#  Note that import order here is important, so rearranging import lists
#  is *not* recommended.
#
#########################################################################################

- name: "Determine which operations to skip"
  hosts: 127.0.0.1
  connection: local

  tasks:
    - name: "Read environment variables"
      ansible.builtin.set_fact:
        skip_alacritty:      "{{ lookup('ansible.builtin.env', 'SKIP_ALACRITTY',      default='0') | ansible.builtin.bool }}"
        skip_bat:            "{{ lookup('ansible.builtin.env', 'SKIP_BAT',            default='0') | ansible.builtin.bool }}"
        skip_broot:          "{{ lookup('ansible.builtin.env', 'SKIP_BROOT',          default='0') | ansible.builtin.bool }}"
        skip_docker:         "{{ lookup('ansible.builtin.env', 'SKIP_DOCKER',         default='0') | ansible.builtin.bool }}"
        skip_dotnet:         "{{ lookup('ansible.builtin.env', 'SKIP_DOTNET',         default='0') | ansible.builtin.bool }}"
        skip_git:            "{{ lookup('ansible.builtin.env', 'SKIP_GIT',            default='0') | ansible.builtin.bool }}"
        skip_golang:         "{{ lookup('ansible.builtin.env', 'SKIP_GOLANG',         default='0') | ansible.builtin.bool }}"
        skip_meld:           "{{ lookup('ansible.builtin.env', 'SKIP_MELD',           default='0') | ansible.builtin.bool }}"
        skip_nodejs:         "{{ lookup('ansible.builtin.env', 'SKIP_NODEJS',         default='0') | ansible.builtin.bool }}"
        skip_onedrive:       "{{ lookup('ansible.builtin.env', 'SKIP_ONEDRIVE',       default='0') | ansible.builtin.bool }}"
        skip_powershell:     "{{ lookup('ansible.builtin.env', 'SKIP_POWERSHELL',     default='0') | ansible.builtin.bool }}"
        skip_prettyping:     "{{ lookup('ansible.builtin.env', 'SKIP_PRETTYPING',     default='0') | ansible.builtin.bool }}"
        skip_python:         "{{ lookup('ansible.builtin.env', 'SKIP_PYTHON',         default='0') | ansible.builtin.bool }}"
        skip_remmina:        "{{ lookup('ansible.builtin.env', 'SKIP_REMMINA',        default='0') | ansible.builtin.bool }}"
        skip_ruby:           "{{ lookup('ansible.builtin.env', 'SKIP_RUBY',           default='0') | ansible.builtin.bool }}"
        skip_rust_lang:      "{{ lookup('ansible.builtin.env', 'SKIP_RUST_LANG',      default='0') | ansible.builtin.bool }}"
        skip_slack:          "{{ lookup('ansible.builtin.env', 'SKIP_SLACK',          default='0') | ansible.builtin.bool }}"
        skip_starship:       "{{ lookup('ansible.builtin.env', 'SKIP_STARSHIP',       default='0') | ansible.builtin.bool }}"
        skip_virtualization: "{{ lookup('ansible.builtin.env', 'SKIP_VIRTUALIZATION', default='0') | ansible.builtin.bool }}"
        skip_vivaldi:        "{{ lookup('ansible.builtin.env', 'SKIP_VIVALDI',        default='0') | ansible.builtin.bool }}"
        skip_vlc:            "{{ lookup('ansible.builtin.env', 'SKIP_VLC',            default='0') | ansible.builtin.bool }}"
        skip_vscode:         "{{ lookup('ansible.builtin.env', 'SKIP_VSCODE',         default='0') | ansible.builtin.bool }}"

##### Operating system packages and configuration

- ansible.builtin.import_playbook: core.yaml

##### Developer tools

# Visual Studio Code
- ansible.builtin.import_playbook: vscode/core.yaml
  when: not skip_vscode

# bat
- ansible.builtin.import_playbook: bat/core.yaml
  when: not skip_bat

# Broot
- ansible.builtin.import_playbook: broot/core.yaml
  when: not skip_broot

# Docker
- ansible.builtin.import_playbook: docker/core.yaml
  when: not skip_docker

# .NET
- ansible.builtin.import_playbook: dotnet/core.yaml
  when: not skip_dotnet

# git
- ansible.builtin.import_playbook: git/core.yaml
  when: not skip_git

# golang
- ansible.builtin.import_playbook: golang/core.yaml
  when: not skip_golang

# Meld (2- and 3-way diff/merge tool)
- ansible.builtin.import_playbook: meld/core.yaml
  when: not skip_meld

# NodeJS
- ansible.builtin.import_playbook: nodejs/core.yaml
  when: not skip_nodejs

# PowerShell
- ansible.builtin.import_playbook: powershell/core.yaml
  when: not skip_powershell

# Python
- ansible.builtin.import_playbook: python/core.yaml
  when: not skip_python

# Ruby
- ansible.builtin.import_playbook: ruby/core.yaml
  when: not skip_ruby

# rust-lang
- ansible.builtin.import_playbook: rust-lang/core.yaml
  when: not skip_rust_lang

# Virtualization (QEMU/KVM)
- ansible.builtin.import_playbook: virtualization/core.yaml
  when: not skip_virtualization

##### Applications

# Alacritty (high performance terminal application)
- ansible.builtin.import_playbook: alacritty/core.yaml
  when: not skip_alacritty

# OneDrive
- ansible.builtin.import_playbook: onedrive/core.yaml
  when: not skip_onedrive

# Prettier version of ping w/ graphs
- ansible.builtin.import_playbook: prettyping/core.yaml
  when: not skip_prettyping

# RDP/X/VNC/SSH client
- ansible.builtin.import_playbook: remmina/core.yaml
  when: not skip_remmina

# Slack desktop application
- ansible.builtin.import_playbook: slack/core.yaml
  when: not skip_slack

# Vivaldi (browser)
- ansible.builtin.import_playbook: vivaldi/core.yaml
  when: not skip_vivaldi

# VLC video player (primarily for codecs)
- ansible.builtin.import_playbook: vlc/core.yaml
  when: not skip_vlc
