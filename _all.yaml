#########################################################################################
#
#  Note that import order here is important, so rearranging import lists
#  is *not* recommended.
#
#########################################################################################

##### Install the base software

- ansible.builtin.import_playbook: "_all_no_customization.yaml"

##### Operating system packages and configuration

- ansible.builtin.import_playbook: customization-text.yaml
- ansible.builtin.import_playbook: customization-ui.yaml

##### Use Starship for its customized prompt

- ansible.builtin.import_playbook: starship/core.yaml
  when: not skip_starship

##### Developer tools

- ansible.builtin.import_playbook: bat/customization.yaml
  when: not skip_bat

- ansible.builtin.import_playbook: docker/customization.yaml
  when: not skip_docker

- ansible.builtin.import_playbook: dotnet/customization.yaml
  when: not skip_dotnet
- ansible.builtin.import_playbook: dotnet/vscode.yaml
  when: not skip_dotnet and not skip_vscode

- ansible.builtin.import_playbook: git/customization.yaml
  when: not skip_git
- ansible.builtin.import_playbook: git/vscode.yaml
  when: not skip_git and not skip_vscode

- ansible.builtin.import_playbook: golang/vscode.yaml
  when: not skip_golang and not skip_vscode

- ansible.builtin.import_playbook: nodejs/customization.yaml
  when: not skip_nodejs
- ansible.builtin.import_playbook: nodejs/vscode.yaml
  when: not skip_nodejs and not skip_vscode

- ansible.builtin.import_playbook: powershell/vscode.yaml
  when: not skip_powershell and not skip_vscode

- ansible.builtin.import_playbook: python/vscode.yaml
  when: not skip_python and not skip_vscode

- ansible.builtin.import_playbook: ruby/customization.yaml
  when: not skip_ruby
- ansible.builtin.import_playbook: ruby/vscode.yaml
  when: not skip_ruby and not skip_vscode

- ansible.builtin.import_playbook: rust-lang/vscode.yaml
  when: not skip_rust_lang and not skip_vscode

- ansible.builtin.import_playbook: vscode/customization.yaml
  when: not skip_vscode

##### Applications

- ansible.builtin.import_playbook: alacritty/customization.yaml
  when: not skip_alacritty
